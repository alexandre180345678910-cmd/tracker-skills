<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
  <title id="t">code-health-audit pipeline</title>
  <desc id="d">Five read-only phases: baseline, coverage ledger, hunt, independent validation and report. Every candidate ends as confirmed, needs validation, or rejected.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B667A"/></marker>
  </defs>
  <rect width="1200" height="430" rx="18" fill="#0F141D"/>
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="48" y="58" fill="#F2F5F9" font-size="26" font-weight="700">code-health-audit</text>
    <text x="48" y="88" fill="#8B95A7" font-size="16">Read-only. An unproven candidate is not a finding: every claim needs a measurement or a full reachability trace.</text>

    <g font-size="15">
      <g transform="translate(48 124)">
        <rect width="190" height="104" rx="12" fill="#18202D" stroke="#2C3547"/>
        <text x="18" y="32" fill="#4FC3A1" font-size="13" font-weight="700">1 · BASELINE</text>
        <text x="18" y="60" fill="#F2F5F9">cost, p95, bundle,</text>
        <text x="18" y="82" fill="#F2F5F9">query time today</text>
      </g>
      <g transform="translate(274 124)">
        <rect width="190" height="104" rx="12" fill="#18202D" stroke="#2C3547"/>
        <text x="18" y="32" fill="#4FC3A1" font-size="13" font-weight="700">2 · LEDGER</text>
        <text x="18" y="60" fill="#F2F5F9">every unit marked</text>
        <text x="18" y="82" fill="#F2F5F9">covered or deferred</text>
      </g>
      <g transform="translate(500 124)">
        <rect width="190" height="104" rx="12" fill="#18202D" stroke="#2C3547"/>
        <text x="18" y="32" fill="#4FC3A1" font-size="13" font-weight="700">3 · HUNT</text>
        <text x="18" y="60" fill="#F2F5F9">isolated agents</text>
        <text x="18" y="82" fill="#F2F5F9">return candidates</text>
      </g>
      <g transform="translate(726 124)">
        <rect width="190" height="104" rx="12" fill="#18202D" stroke="#FF7A59"/>
        <text x="18" y="32" fill="#FF7A59" font-size="13" font-weight="700">4 · DISPROVE</text>
        <text x="18" y="60" fill="#F2F5F9">a fresh verifier</text>
        <text x="18" y="82" fill="#F2F5F9">attacks each one</text>
      </g>
      <g transform="translate(952 124)">
        <rect width="200" height="104" rx="12" fill="#18202D" stroke="#2C3547"/>
        <text x="18" y="32" fill="#4FC3A1" font-size="13" font-weight="700">5 · REPORT</text>
        <text x="18" y="60" fill="#F2F5F9">value per unit</text>
        <text x="18" y="82" fill="#F2F5F9">of change risk</text>
      </g>
      <path d="M242 176H270" stroke="#5B667A" stroke-width="2" marker-end="url(#arr)"/><path d="M468 176H496" stroke="#5B667A" stroke-width="2" marker-end="url(#arr)"/><path d="M694 176H722" stroke="#5B667A" stroke-width="2" marker-end="url(#arr)"/><path d="M920 176H948" stroke="#5B667A" stroke-width="2" marker-end="url(#arr)"/>
    </g>

    <!-- verdicts -->
    <path d="M821 232V262M821 262H260M821 262H940M260 262V284M600 262V284M940 262V284" fill="none" stroke="#3A4356" stroke-width="2"/>
    <g font-size="15">
      <g transform="translate(140 288)">
        <rect width="240" height="74" rx="12" fill="#14382F" stroke="#4FC3A1"/>
        <text x="120" y="32" fill="#7FE0C2" font-weight="700" text-anchor="middle">confirmed</text>
        <text x="120" y="56" fill="#C9D1DD" font-size="14" text-anchor="middle">saving in ms, bytes or money</text>
      </g>
      <g transform="translate(480 288)">
        <rect width="240" height="74" rx="12" fill="#3A2F14" stroke="#F5B83D"/>
        <text x="120" y="32" fill="#F5CF7A" font-weight="700" text-anchor="middle">needs_validation</text>
        <text x="120" y="56" fill="#C9D1DD" font-size="14" text-anchor="middle">names the missing fact</text>
      </g>
      <g transform="translate(820 288)">
        <rect width="240" height="74" rx="12" fill="#3A1C1C" stroke="#E5534B"/>
        <text x="120" y="32" fill="#F08A84" font-weight="700" text-anchor="middle">rejected</text>
        <text x="120" y="56" fill="#C9D1DD" font-size="14" text-anchor="middle">kept, so it is not rediscovered</text>
      </g>
    </g>
    <text x="48" y="400" fill="#8B95A7" font-size="14">dead code · duplication · bundle · route latency · queries · cold start · compute cost · observability cost</text>
  </g>
</svg>
